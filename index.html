<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>arssh2 — now playing</title>
<style>
  :root{
    --asphalt: #0a0c0d;
    --panel: #14181a;
    --panel-edge: #1f2528;
    --amber: #ffb92e;
    --amber-dim: #8a641c;
    --teal: #2dd4bf;
    --text: #e8e8e6;
    --text-dim: #7a8286;
    --accent: 255,185,46;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:var(--asphalt);
    color:var(--text);
    font-family:'Space Grotesk', -apple-system, 'Segoe UI', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    position:relative;
  }

  .bg-layer{
    position:fixed;
    inset:-10%;
    background-size:cover;
    background-position:center;
    filter:blur(70px) brightness(0.42) saturate(1.4);
    transform:scale(1.15);
    opacity:0;
    transition:opacity 1.6s ease;
    z-index:0;
    animation:kenburns 26s ease-in-out infinite alternate;
  }

  .bg-layer.active{ opacity:1; }

  @keyframes kenburns{
    0%{ transform:scale(1.15) translate(0,0); }
    100%{ transform:scale(1.32) translate(-1.5%, 1.5%); }
  }

  .scrim{
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse 900px 600px at 50% 30%, rgba(0,0,0,0.15), rgba(0,0,0,0.55) 70%);
    z-index:1;
    pointer-events:none;
  }

  @font-face{
    font-family:'Space Grotesk';
    src:local('Space Grotesk');
  }

  .unit{
    position:relative;
    z-index:2;
    width:100%;
    max-width:720px;
    background:linear-gradient(180deg, rgba(23,28,30,0.88), rgba(16,19,21,0.92));
    backdrop-filter:blur(6px);
    border:1px solid var(--panel-edge);
    border-radius:22px;
    padding:28px;
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,0.7),
      0 0 60px -20px rgba(var(--accent), 0.25),
      inset 0 1px 0 rgba(255,255,255,0.04);
    transition:box-shadow 1.4s ease;
  }

  .screen{
    background:var(--panel);
    border-radius:16px;
    border:1px solid var(--panel-edge);
    padding:34px;
    position:relative;
    overflow:hidden;
    min-height:280px;
  }

  .screen::before{
    content:'';
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      180deg,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
  }

  .row{
    display:flex;
    gap:18px;
    align-items:center;
  }

  .art{
    width:128px;
    height:128px;
    border-radius:10px;
    flex-shrink:0;
    background:#1c2225;
    background-size:cover;
    background-position:center;
    border:1px solid rgba(255,255,255,0.06);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 0.5s ease;
  }

  .meta{ min-width:0; flex:1; transition:opacity 0.5s ease; }

  .fade-out{ opacity:0; }

  .art svg{ width:48px; height:48px; opacity:0.3; }

  .status-line{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'IBM Plex Mono', 'SF Mono', monospace;
    font-size:14px;
    letter-spacing:0.06em;
    color:var(--text-dim);
    margin-bottom:16px;
    text-transform:lowercase;
  }

  .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--amber-dim);
    flex-shrink:0;
    transition:background-color 1s ease, box-shadow 1s ease;
  }

  .dot.live{
    background:rgb(var(--accent));
    box-shadow:0 0 10px 1px rgba(var(--accent), 0.65);
    animation:pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.55; transform:scale(0.85); }
  }

  .track{
    font-size:clamp(20px, 5.5vw, 32px);
    font-weight:600;
    line-height:1.25;
    margin:0 0 6px;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }

  .artist{
    font-size:clamp(14px, 3.6vw, 20px);
    color:var(--text-dim);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .bars{
    display:flex;
    align-items:flex-end;
    gap:4px;
    height:26px;
    margin-top:20px;
  }

  .bars span{
    width:4px;
    background:rgb(var(--accent));
    border-radius:1px;
    opacity:0.75;
    transition:background-color 1s ease;
  }

  .bars.playing span{ animation:bounce 1.1s ease-in-out infinite; }
  .bars span:nth-child(1){ animation-delay:0s; }
  .bars span:nth-child(2){ animation-delay:0.15s; }
  .bars span:nth-child(3){ animation-delay:0.3s; }
  .bars span:nth-child(4){ animation-delay:0.1s; }
  .bars span:nth-child(5){ animation-delay:0.25s; }

  @keyframes bounce{
    0%,100%{ height:6px; }
    50%{ height:26px; }
  }

  .footer{
    margin-top:24px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--text-dim);
    display:flex;
    justify-content:space-between;
    letter-spacing:0.04em;
  }

  .lyrics{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--panel-edge);
    max-height:180px;
    overflow-y:auto;
    font-size:14px;
    line-height:1.7;
    color:var(--text-dim);
    white-space:pre-line;
    -webkit-mask-image:linear-gradient(180deg, #000 85%, transparent 100%);
    mask-image:linear-gradient(180deg, #000 85%, transparent 100%);
  }

  .lyrics::-webkit-scrollbar{ width:4px; }
  .lyrics::-webkit-scrollbar-thumb{ background:var(--panel-edge); border-radius:2px; }

  .lyrics.empty{ display:none; }

  .lyric-line{
    padding:3px 0;
    opacity:0.55;
    transition:opacity 0.35s ease, color 0.35s ease, transform 0.35s ease;
  }

  .lyric-line.active{
    opacity:1;
    color:var(--text);
    font-weight:600;
    transform:translateX(2px);
  }

  @media (max-width: 480px){
    body{ padding:14px; }
    .unit{ padding:16px; border-radius:18px; }
    .screen{ padding:18px; min-height:auto; }
    .row{ gap:14px; }
    .art{ width:76px; height:76px; }
    .art svg{ width:32px; height:32px; }
    .status-line{ font-size:12px; margin-bottom:12px; }
    .footer{ font-size:11px; margin-top:16px; }
    .lyrics{ font-size:13px; max-height:140px; margin-top:16px; padding-top:14px; }
  }

  @media (max-width: 360px){
    .row{ flex-direction:column; align-items:flex-start; gap:12px; }
    .art{ width:96px; height:96px; }
  }

  @media (prefers-reduced-motion: reduce){
    .dot.live, .bars span, .bg-layer{ animation:none !important; }
  }
</style>
</head>
<body>

  <div class="bg-layer" id="bgA"></div>
  <div class="bg-layer" id="bgB"></div>
  <div class="scrim"></div>

  <div class="unit">
    <div class="screen">
      <div class="status-line">
        <span class="dot" id="dot"></span>
        <span id="statusText">connecting</span>
      </div>

      <div class="row">
        <div class="art" id="art">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
          </svg>
        </div>
        <div class="meta">
          <p class="track" id="trackName">—</p>
          <p class="artist" id="artistName">waiting for a signal</p>
        </div>
      </div>

      <div class="bars" id="bars">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="lyrics empty" id="lyrics"></div>
    </div>

    <div class="footer">
      <span>arssh2</span>
      <span id="updated">—</span>
    </div>
  </div>

<script>
  const USER = 'arssh2';
  const API_KEY = '2aab1059e9b8780dd6a9b3aef05a3108';
  const POLL_MS = 5000;

  const el = {
    dot: document.getElementById('dot'),
    status: document.getElementById('statusText'),
    art: document.getElementById('art'),
    track: document.getElementById('trackName'),
    artist: document.getElementById('artistName'),
    bars: document.getElementById('bars'),
    updated: document.getElementById('updated'),
    meta: document.querySelector('.meta'),
    bgA: document.getElementById('bgA'),
    bgB: document.getElementById('bgB'),
    lyrics: document.getElementById('lyrics'),
  };

  let bgActive = 'A';
  let lastTrackKey = null;
  let syncedLines = null;
  let trackStartMs = null;
  let activeLine = -1;

  const fallbackArt = el.art.innerHTML;

  const colorCache = {};

  function extractDominantColor(imgUrl){
    return new Promise((resolve) => {
      if (colorCache[imgUrl] !== undefined) return resolve(colorCache[imgUrl]);
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try{
          const c = document.createElement('canvas');
          c.width = 16; c.height = 16;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, 16, 16);
          const data = ctx.getImageData(0, 0, 16, 16).data;
          let r=0,g=0,b=0,n=0;
          for (let i=0; i<data.length; i+=4){
            const rr=data[i], gg=data[i+1], bb=data[i+2];
            const lum = (rr+gg+bb)/3;
            if (lum < 25 || lum > 235) continue;
            r+=rr; g+=gg; b+=bb; n++;
          }
          if (n === 0){ colorCache[imgUrl] = null; return resolve(null); }
          const avg = `${Math.round(r/n)},${Math.round(g/n)},${Math.round(b/n)}`;
          colorCache[imgUrl] = avg;
          resolve(avg);
        } catch(e){
          colorCache[imgUrl] = null;
          resolve(null);
        }
      };
      img.onerror = () => { colorCache[imgUrl] = null; resolve(null); };
      img.src = imgUrl;
    });
  }

  function crossfadeBackground(imgUrl){
    if (!imgUrl) return;
    const showing = bgActive === 'A' ? el.bgA : el.bgB;
    const hidden = bgActive === 'A' ? el.bgB : el.bgA;
    hidden.style.backgroundImage = `url('${imgUrl}')`;
    hidden.classList.add('active');
    showing.classList.remove('active');
    bgActive = bgActive === 'A' ? 'B' : 'A';
  }

  const lyricsCache = {};

  function parseLRC(lrcText){
    return lrcText.split('\n').map(line => {
      const m = line.match(/^\[(\d{1,2}):(\d{2}(?:\.\d+)?)\](.*)$/);
      if (!m) return null;
      const time = parseInt(m[1], 10) * 60 + parseFloat(m[2]);
      const text = m[3].trim();
      return text ? { time, text } : null;
    }).filter(Boolean);
  }

  async function fetchLyricsData(artist, title){
    const key = `${artist}|${title}`.toLowerCase();
    if (lyricsCache[key] !== undefined) return lyricsCache[key];
    let result = { synced: null, plain: null };
    try{
      const res = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`);
      if (res.ok){
        const data = await res.json();
        if (data.syncedLyrics) result.synced = parseLRC(data.syncedLyrics);
        if (data.plainLyrics) result.plain = data.plainLyrics.trim();
      }
    } catch(e){ /* fall through with nulls */ }
    lyricsCache[key] = result;
    return result;
  }

  function timeAgo(unixSeconds){
    const diff = Math.floor(Date.now()/1000) - unixSeconds;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff/60) + 'm ago';
    if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
    return Math.floor(diff/86400) + 'd ago';
  }

  const artCache = {};

  async function fetchArtworkFallback(artist, track){
    const key = `${artist}|${track}`.toLowerCase();
    if (artCache[key] !== undefined) return artCache[key];

    try{
      const q = encodeURIComponent(`${artist} ${track}`);
      const res = await fetch(`https://itunes.apple.com/search?term=${q}&entity=song&limit=1`);
      const data = await res.json();
      const raw = data?.results?.[0]?.artworkUrl100;
      const url = raw ? raw.replace('100x100bb', '600x600bb') : null;
      artCache[key] = url;
      return url;
    } catch(e){
      return null;
    }
  }

  async function fetchNowPlaying(){
    const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USER}&api_key=${API_KEY}&format=json&limit=1&_=${Date.now()}`;
    try{
      const res = await fetch(url, { cache: 'no-store' });
      const data = await res.json();
      const t = data?.recenttracks?.track?.[0];

      if (!t){
        el.status.textContent = 'no scrobbles yet';
        el.dot.className = 'dot';
        return;
      }

      const isNow = t['@attr']?.nowplaying === 'true';
      const trackTitle = t.name || 'Unknown track';
      const artistName = t.artist?.['#text'] || 'Unknown artist';
      const trackKey = `${artistName}|${trackTitle}`.toLowerCase();
      const isNewTrack = trackKey !== lastTrackKey;
      lastTrackKey = trackKey;

      let imgUrl = t.image?.find(i => i.size === 'extralarge')?.['#text']
                || t.image?.slice(-1)[0]?.['#text'];

      if (!imgUrl){
        imgUrl = await fetchArtworkFallback(artistName, trackTitle);
      }

      if (isNewTrack){
        el.meta.classList.add('fade-out');
        el.art.classList.add('fade-out');
      }

      setTimeout(() => {
        el.track.textContent = trackTitle;
        el.artist.textContent = artistName;

        if (imgUrl){
          el.art.style.backgroundImage = `url('${imgUrl}')`;
          el.art.innerHTML = '';
        } else {
          el.art.style.backgroundImage = 'none';
          el.art.innerHTML = fallbackArt;
        }

        el.meta.classList.remove('fade-out');
        el.art.classList.remove('fade-out');
      }, isNewTrack ? 350 : 0);

      if (isNewTrack && imgUrl){
        crossfadeBackground(imgUrl);
        extractDominantColor(imgUrl).then(rgb => {
          if (rgb) document.documentElement.style.setProperty('--accent', rgb);
        });
      }

      if (isNewTrack){
        el.lyrics.classList.add('empty');
        el.lyrics.innerHTML = '';
        syncedLines = null;
        activeLine = -1;
        trackStartMs = Date.now();

        fetchLyricsData(artistName, trackTitle).then(({ synced, plain }) => {
          if (trackKey !== lastTrackKey) return; // track moved on before this resolved

          if (synced && synced.length){
            syncedLines = synced;
            el.lyrics.innerHTML = synced.map((l, i) =>
              `<div class="lyric-line" data-i="${i}">${l.text}</div>`
            ).join('');
            el.lyrics.classList.remove('empty');
          } else if (plain){
            el.lyrics.textContent = plain;
            el.lyrics.classList.remove('empty');
          } else {
            el.lyrics.classList.add('empty');
          }
        });
      }

      if (isNow){
        el.status.textContent = 'now playing';
        el.dot.className = 'dot live';
        el.bars.className = 'bars playing';
      } else {
        el.status.textContent = 'last played';
        el.dot.className = 'dot';
        el.bars.className = 'bars';
      }

      el.updated.textContent = isNow ? 'live' : (t.date ? timeAgo(t.date.uts) : '');

    } catch(err){
      el.status.textContent = 'connection error';
      el.dot.className = 'dot';
      el.updated.textContent = 'retrying…';
    }
  }

  function tickLyrics(){
    if (!syncedLines || !trackStartMs) return;
    const elapsed = (Date.now() - trackStartMs) / 1000;
    let idx = -1;
    for (let i = 0; i < syncedLines.length; i++){
      if (syncedLines[i].time <= elapsed) idx = i; else break;
    }
    if (idx !== activeLine){
      const prev = el.lyrics.querySelector('.lyric-line.active');
      if (prev) prev.classList.remove('active');
      if (idx >= 0){
        const cur = el.lyrics.querySelector(`.lyric-line[data-i="${idx}"]`);
        if (cur){
          cur.classList.add('active');
          cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      }
      activeLine = idx;
    }
  }

  fetchNowPlaying();
  setInterval(fetchNowPlaying, POLL_MS);
  setInterval(tickLyrics, 400);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') fetchNowPlaying();
  });
</script>

</body>
</html>
