<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>arssh2 — now playing</title>
<style>
  :root{
    --asphalt: #0a1712;
    --panel: #0f221a;
    --panel-edge: #c9a24b;
    --amber: #c9a24b;
    --amber-dim: #6b5527;
    --teal: #c9a24b;
    --text: #f2e6c9;
    --text-dim: #9a8a5e;
    --accent: 201,162,75;
    --warm: #c9a24b;
    --cream: #0f221a;
  }

  *{box-sizing:border-box; overflow-wrap:break-word;}

  html,body{
    margin:0;
    min-height:100%;
    background:var(--asphalt);
    color:var(--text);
    font-family:'Space Grotesk', -apple-system, 'Segoe UI', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    position:relative;
    overflow-x:hidden;
    width:100%;
  }

  .bg-layer{
    position:fixed;
    inset:-10%;
    background-size:cover;
    background-position:center;
    filter:blur(70px) brightness(0.42) saturate(0.6) sepia(0.6) hue-rotate(45deg) saturate(1.8);
    transform:scale(1.15);
    opacity:0;
    transition:opacity 1.6s ease;
    z-index:0;
    animation:kenburns 26s ease-in-out infinite alternate;
  }

  .bg-layer.active{ opacity:1; }

  @keyframes kenburns{
    0%{ transform:scale(1.15) translate(0,0); }
    100%{ transform:scale(1.32) translate(-1.5%, 1.5%); }
  }

  .scrim{
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse 900px 600px at 50% 30%, rgba(0,0,0,0.15), rgba(0,0,0,0.55) 70%);
    z-index:1;
    pointer-events:none;
  }

  .grid-horizon{ display:none; }

  @font-face{
    font-family:'Space Grotesk';
    src:local('Space Grotesk');
  }

  .unit{
    position:relative;
    z-index:2;
    width:100%;
    max-width:720px;
    background:#0d1e17;
    border:1px solid var(--panel-edge);
    border-radius:6px;
    padding:28px;
    box-shadow:
      0 30px 70px -25px rgba(0,0,0,0.6),
      inset 0 0 0 1px rgba(201,162,75,0.15);
    animation:riseIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    overflow:hidden;
  }

  .unit::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(115deg, transparent 40%, rgba(242,230,201,0.06) 50%, transparent 60%);
    background-size:250% 250%;
    background-position:-100% -100%;
    animation:shimmer 7s ease-in-out infinite;
    pointer-events:none;
  }

  @keyframes shimmer{
    0%, 40%{ background-position:-100% -100%; }
    60%, 100%{ background-position:100% 100%; }
  }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .screen{
    background:var(--panel);
    border-radius:4px;
    border:1px solid var(--panel-edge);
    padding:34px;
    position:relative;
    overflow:hidden;
    min-height:280px;
  }

  .screen::before{
    content:'';
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      180deg,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
  }

  .deco-pattern{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.2s ease;
  }

  .deco-pattern.show{ opacity:1; }

  .screen > .row, .screen > .bars, .screen > .progress-wrap, .screen > .lyrics{
    position:relative;
    z-index:1;
  }

  .row{
    display:flex;
    gap:20px;
    align-items:center;
    perspective:700px;
  }

  .art{
    width:128px;
    height:128px;
    border-radius:4px;
    flex-shrink:0;
    background:#1c2225;
    background-size:cover;
    background-position:center;
    border:1px solid var(--panel-edge);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 0.5s ease, transform 0.15s ease-out;
    transform-style:preserve-3d;
    box-shadow:0 10px 24px -8px rgba(0,0,0,0.5);
  }

  .meta{ min-width:0; flex:1; transition:opacity 0.5s ease; }

  .fade-out{ opacity:0; }

  .art svg{ width:48px; height:48px; opacity:0.3; }

  .status-line{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'IBM Plex Mono', 'SF Mono', monospace;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--text-dim);
    margin-bottom:16px;
    text-transform:uppercase;
  }

  #statusText{
    background:var(--cream);
    color:var(--warm);
    border:1px solid var(--panel-edge);
    padding:2px 8px;
    border-radius:2px;
    font-weight:500;
    letter-spacing:0.08em;
  }

  .genre-icon{
    color:var(--warm);
    font-size:15px;
    opacity:0.85;
  }
  .genre-icon svg{ width:15px; height:15px; display:block; }

  .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--amber-dim);
    flex-shrink:0;
    transition:background-color 1s ease, box-shadow 1s ease;
  }

  .dot.live{
    background:rgb(var(--accent));
    box-shadow:0 0 10px 1px rgba(var(--accent), 0.65);
    animation:pulse 1.8s ease-in-out infinite;
  }

  .skip-btn{
    margin-left:auto;
    background:transparent;
    border:1px solid var(--panel-edge);
    color:var(--warm);
    border-radius:3px;
    padding:6px 13px;
    font-size:16px;
    cursor:pointer;
    transition:background-color 0.15s ease;
  }

  .skip-btn:hover{
    background:rgba(201,162,75,0.12);
    color:var(--warm);
  }

  .skip-btn:disabled{
    opacity:0.4;
    cursor:default;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.55; transform:scale(0.85); }
  }

  .track{
    font-size:clamp(20px, 5.5vw, 32px);
    font-weight:600;
    line-height:1.25;
    letter-spacing:-0.01em;
    margin:0 0 6px;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    text-shadow:none;
    letter-spacing:0.01em;
  }

  .artist{
    font-size:clamp(14px, 3.6vw, 20px);
    color:var(--text-dim);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    letter-spacing:0.01em;
  }

  .bars{
    display:flex;
    align-items:flex-end;
    gap:5px;
    height:38px;
    margin-top:22px;
  }

  .bars span{
    width:5px;
    height:6px;
    background:rgb(var(--accent));
    border-radius:2px;
    opacity:0.9;
    transition:height 0.16s ease, background-color 1s ease;
  }

  .footer{
    margin-top:24px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--text-dim);
    display:flex;
    justify-content:space-between;
    letter-spacing:0.04em;
  }

  .lyrics{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--panel-edge);
    max-height:180px;
    overflow-y:auto;
    font-size:14px;
    line-height:1.7;
    color:var(--text-dim);
    white-space:pre-line;
    -webkit-mask-image:linear-gradient(180deg, #000 85%, transparent 100%);
    mask-image:linear-gradient(180deg, #000 85%, transparent 100%);
  }

  .lyrics::-webkit-scrollbar{ width:4px; }
  .lyrics::-webkit-scrollbar-thumb{ background:var(--panel-edge); border-radius:2px; }

  .lyrics.empty{ display:none; }

  .lyric-line{
    padding:3px 0;
    opacity:0.55;
    transition:opacity 0.35s ease, color 0.35s ease, transform 0.35s ease;
  }

  .lyric-line.active{
    opacity:1;
    color:var(--text);
    font-weight:600;
    transform:translateX(2px);
  }

  @media (max-width: 480px){
    body{ padding:14px; }
    .unit{ padding:16px; border-radius:18px; }
    .screen{ padding:18px; min-height:auto; }
    .row{ gap:14px; }
    .art{ width:76px; height:76px; }
    .art svg{ width:32px; height:32px; }
    .status-line{ font-size:12px; margin-bottom:12px; }
    .footer{ font-size:11px; margin-top:16px; }
    .lyrics{ font-size:13px; max-height:140px; margin-top:16px; padding-top:14px; }
    .bg-layer{ filter:blur(36px) brightness(0.42) saturate(0.6) sepia(0.6) hue-rotate(45deg) saturate(1.8); }
    .particle:nth-child(n+13){ display:none; }
  }

  @media (max-width: 360px){
    .row{ flex-direction:column; align-items:flex-start; gap:12px; }
    .art{ width:96px; height:96px; }
  }

  .progress-wrap{ margin-top:16px; }

  .progress-track{
    width:100%;
    height:4px;
    background:rgba(201,162,75,0.18);
    border-radius:2px;
    overflow:hidden;
  }

  .progress-fill{
    height:100%;
    width:0%;
    background:rgb(var(--accent));
    border-radius:2px;
    transition:width 0.9s linear, background-color 1s ease;
  }

  .progress-time{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    margin-top:6px;
  }

  .particles{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }

  .particle{
    position:absolute;
    bottom:-10px;
    border-radius:50%;
    background:rgba(255,255,255,0.55);
    opacity:0;
    animation:floatUp linear infinite;
  }

  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:0.7; }
    90%{ opacity:0.25; }
    100%{ transform:translateY(-115vh) translateX(var(--drift, 20px)); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .dot.live, .bg-layer, .unit, .unit::after{ animation:none !important; }
    .particle{ animation:none !important; opacity:0 !important; }
  }

  .queue-section{
    margin-top:26px;
    padding-top:22px;
    border-top:1px solid var(--panel-edge);
  }

  .queue-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--text-dim);
    text-transform:lowercase;
    margin-bottom:10px;
  }

  .request-form{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .request-form input{
    flex:1 1 140px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--panel-edge);
    border-radius:3px;
    padding:10px 12px;
    color:var(--text);
    font-family:inherit;
    font-size:16px;
    outline:none;
  }

  .request-form input::placeholder{ color:var(--text-dim); }

  .request-form input:focus{ border-color:var(--warm); }

  .request-form button{
    flex:1 1 100%;
    background:var(--warm);
    border:1px solid var(--warm);
    border-radius:3px;
    padding:11px;
    color:#0a1712;
    font-weight:600;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    letter-spacing:0.04em;
    transition:opacity 0.15s ease;
  }

  .request-form button:hover{ opacity:0.85; }

  .request-form button:disabled{ opacity:0.5; cursor:default; }

  .queue-status{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--text-dim);
    margin-top:8px;
    min-height:16px;
  }

  .song-input-wrap{
    position:relative;
    flex:1 1 140px;
  }

  .song-input-wrap input{ width:100%; }

  .song-suggestions{
    position:absolute;
    top:calc(100% + 4px);
    left:0;
    right:0;
    background:#1a2023;
    border:1px solid var(--panel-edge);
    border-radius:8px;
    overflow:hidden;
    z-index:10;
    display:none;
    max-height:220px;
    overflow-y:auto;
    box-shadow:0 12px 24px -8px rgba(0,0,0,0.6);
  }

  .song-suggestions.show{ display:block; }

  .song-suggestion{
    padding:9px 12px;
    cursor:pointer;
    font-size:13px;
    border-bottom:1px solid rgba(255,255,255,0.04);
  }

  .song-suggestion:last-child{ border-bottom:none; }

  .song-suggestion:hover, .song-suggestion.highlighted{
    background:rgba(255,255,255,0.06);
  }

  .song-suggestion .ss-title{ color:var(--text); }
  .song-suggestion .ss-artist{ color:var(--text-dim); font-size:12px; }

  .queue-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:180px;
    overflow-y:auto;
  }

  .queue-empty{
    font-size:13px;
    color:var(--text-dim);
    font-style:italic;
  }

  .queue-item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    padding:8px 10px;
    background:rgba(255,255,255,0.03);
    border-radius:8px;
    font-size:14px;
  }

  .queue-item .qi-song{ font-weight:600; }
  .queue-item .qi-artist{ color:var(--text-dim); font-size:13px; }
  .queue-item .qi-by{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    white-space:nowrap;
  }
</style>
</head>
<body>

  <div class="bg-layer" id="bgA"></div>
  <div class="bg-layer" id="bgB"></div>
  <div class="scrim"></div>
  <div class="grid-horizon"></div>
  <div class="particles" id="particles"></div>

  <div class="unit">
    <div class="screen">
      <div class="deco-pattern" id="decoPattern"></div>
      <div class="status-line">
        <span class="dot" id="dot"></span>
        <span id="statusText">connecting</span>
        <span id="genreIcon" class="genre-icon"></span>
        <button id="skipBtn" class="skip-btn" title="Skip this song">⏭</button>
      </div>

      <div class="row">
        <div class="art" id="art">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
          </svg>
        </div>
        <div class="meta">
          <p class="track" id="trackName">—</p>
          <p class="artist" id="artistName">waiting for a signal</p>
        </div>
      </div>

      <div class="bars" id="bars">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="progress-wrap" id="progressWrap" style="display:none;">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-time">
          <span id="elapsedTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>

      <div class="lyrics empty" id="lyrics"></div>
    </div>

    <div class="footer">
      <span>arssh2</span>
      <span id="updated">—</span>
    </div>

    <div class="queue-section">
      <div class="queue-label">request a song</div>
      <form id="requestForm" class="request-form">
        <div class="song-input-wrap">
          <input type="text" id="reqSong" placeholder="song title" required maxlength="120" autocomplete="off">
          <div class="song-suggestions" id="songSuggestions"></div>
        </div>
        <input type="text" id="reqArtist" placeholder="artist (optional)" maxlength="120">
        <input type="text" id="reqName" placeholder="your name (optional)" maxlength="60">
        <button type="submit" id="reqSubmit">add to queue</button>
      </form>
      <div class="queue-status" id="reqStatus"></div>

      <div class="queue-label" style="margin-top:20px;">up next</div>
      <div class="queue-list" id="queueList">
        <div class="queue-empty">nothing queued yet — be the first</div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZGF0a3B3anN5dWhzdnRncHdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNTMyMTMsImV4cCI6MjEwNDcyOTIxM30.5C3DVIEU5tyOK9RiX5CQVG7EQ3ntYumZ4V7MQn6Zx84';

  const el = {

  };

  let trackDurationSec = null;

  function formatTime(sec){
    sec = Math.max(0, Math.floor(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  let bgActive = 'A';

  let isCurrentlyPlaying = false;

  const fallbackArt = el.art.innerHTML;

  const genreIcons = {

    rap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="9" width="10" height="7" rx="3"/><path d="M12 16v3M9 4h6v5H9z"/></svg>',
    electro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>',

    classic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',
    country: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10" width="16" height="7" rx="1"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>',
    indie: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10" width="16" height="7" rx="1"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>',

  };

  function iconForGenre(genre){
    if (!genre) return '';
    const g = genre.toLowerCase();
    for (const key in genreIcons){
      if (g.includes(key)) return genreIcons[key];
    }
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>';
  }

  const colorCache = {};

  function extractDominantColor(imgUrl){
    return new Promise((resolve) => {
      if (colorCache[imgUrl] !== undefined) return resolve(colorCache[imgUrl]);
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try{
          const c = document.createElement('canvas');
          c.width = 16; c.height = 16;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, 16, 16);
          const data = ctx.getImageData(0, 0, 16, 16).data;
          let r=0,g=0,b=0,n=0;
          for (let i=0; i<data.length; i+=4){
            const rr=data[i], gg=data[i+1], bb=data[i+2];
            const lum = (rr+gg+bb)/3;
            if (lum < 25 || lum > 235) continue;
            r+=rr; g+=gg; b+=bb; n++;
          }
          if (n === 0){ colorCache[imgUrl] = null; return resolve(null); }
          const avg = `${Math.round(r/n)},${Math.round(g/n)},${Math.round(b/n)}`;
          colorCache[imgUrl] = avg;
          resolve(avg);
        } catch(e){
          colorCache[imgUrl] = null;
          resolve(null);
        }
      };
      img.onerror = () => { colorCache[imgUrl] = null; resolve(null); };
      img.src = `${WORKER_URL}?action=imgproxy&url=${encodeURIComponent(imgUrl)}`;
    });
  }

  function crossfadeBackground(imgUrl){
    if (!imgUrl) return;
    const showing = bgActive === 'A' ? el.bgA : el.bgB;
    const hidden = bgActive === 'A' ? el.bgB : el.bgA;
    hidden.style.backgroundImage = `url('${imgUrl}')`;
    hidden.classList.add('active');
    showing.classList.remove('active');
    bgActive = bgActive === 'A' ? 'B' : 'A';
  }

  const lyricsCache = {};

  function parseLRC(lrcText){
    return lrcText.split('\n').map(line => {
      const m = line.match(/^\[(\d{1,2}):(\d{2}(?:\.\d+)?)\](.*)$/);
      if (!m) return null;
      const time = parseInt(m[1], 10) * 60 + parseFloat(m[2]);
      const text = m[3].trim();
      return text ? { time, text } : null;
    }).filter(Boolean);
  }

  async function fetchLyricsData(artist, title){
    const key = `${artist}|${title}`.toLowerCase();
    if (lyricsCache[key] !== undefined) return lyricsCache[key];
    let result = { synced: null, plain: null, notFound: false };

    try{
      const res = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`);
      if (res.ok){
        const data = await res.json();
        if (data.syncedLyrics) result.synced = parseLRC(data.syncedLyrics);
        if (data.plainLyrics) result.plain = data.plainLyrics.trim();
      }
    } catch(e){ /* fall through to search */ }

    if (!result.synced && !result.plain){
      try{
        const q = encodeURIComponent(`${artist} ${title}`);
        const res2 = await fetch(`https://lrclib.net/api/search?q=${q}`);
        if (res2.ok){
          const list = await res2.json();
          const best = Array.isArray(list) ? list.find(x => x.syncedLyrics || x.plainLyrics) : null;
          if (best){
            if (best.syncedLyrics) result.synced = parseLRC(best.syncedLyrics);
            if (best.plainLyrics) result.plain = best.plainLyrics.trim();
          }
        }
      } catch(e){ /* give up, leave nulls */ }
    }

    result.notFound = !result.synced && !result.plain;
    lyricsCache[key] = result;
    return result;
  }

  const artCache = {};

  async function fetchArtworkFallback(artist, track){
    const key = `${artist}|${track}`.toLowerCase();
    if (artCache[key] !== undefined) return artCache[key];

    try{
      const q = encodeURIComponent(`${artist} ${track}`);
      const res = await fetch(`https://itunes.apple.com/search?term=${q}&entity=song&limit=1`);
      const data = await res.json();
      const raw = data?.results?.[0]?.artworkUrl100;
      const url = raw ? raw.replace('100x100bb', '600x600bb') : null;
      artCache[key] = url;
      return url;
    } catch(e){
      return null;
    }
  }

  const WORKER_URL = 'https://icy-dust-0e5d.aarssh7.workers.dev/';

  async function fetchNowPlaying(){
    try{
      const res = await fetch(`${WORKER_URL}?_=${Date.now()}`, { cache: 'no-store' });
      const data = await res.json();

      if (data.error){
        el.status.textContent = 'connection error';
        el.dot.className = 'dot';
        return;
      }

      const isNow = !!data.is_playing;

      if (!data.track){
        el.status.textContent = isNow ? 'now playing' : 'not listening right now';
        el.dot.className = isNow ? 'dot live' : 'dot';
        isCurrentlyPlaying = false;
        el.progressWrap.style.display = 'none';
        stopEqualizer();
        return;
      }

      const trackTitle = data.track;
      const artistName = data.artist || 'Unknown artist';
      const trackKey = `${artistName}|${trackTitle}`.toLowerCase();
      const isNewTrack = trackKey !== lastTrackKey;
      lastTrackKey = trackKey;

      // exact position straight from Spotify — recalibrated every single poll, no drift possible
      accumulatedElapsedSec = (data.progress_ms || 0) / 1000;
      playStartMs = isNow ? Date.now() : null;
      wasPlaying = isNow;

      let imgUrl = data.album_art || null;
      if (!imgUrl){
        imgUrl = await fetchArtworkFallback(artistName, trackTitle);
      }

      if (isNewTrack){
        el.meta.classList.add('fade-out');
        el.art.classList.add('fade-out');
      }

      setTimeout(() => {
        el.track.textContent = trackTitle;
        el.artist.textContent = artistName;

        if (imgUrl){
          el.art.style.backgroundImage = `url('${imgUrl}')`;
          el.art.innerHTML = '';
        } else {
          el.art.style.backgroundImage = 'none';
          el.art.innerHTML = fallbackArt;
        }

        el.meta.classList.remove('fade-out');
        el.art.classList.remove('fade-out');
      }, isNewTrack ? 350 : 0);

      if (isNewTrack && imgUrl){
        crossfadeBackground(imgUrl);
        // global UI accent stays fixed gold — but the deco pattern uses the real art's color
      }

      if (isNewTrack){
        el.genreIcon.innerHTML = iconForGenre(data.genre);

        el.decoPattern.classList.remove('show');
        const artColorPromise = imgUrl ? extractDominantColor(imgUrl) : Promise.resolve(null);
        artColorPromise.then(rgb => {
          if (trackKey !== lastTrackKey) return;
          if (rgb){
            el.decoPattern.style.background = `radial-gradient(circle at 30% 15%, rgba(${rgb},0.28), transparent 60%)`;
            setTimeout(() => el.decoPattern.classList.add('show'), 150);
          }
        });
      }

      // exact duration straight from Spotify — no separate lookup needed
      trackDurationSec = data.duration_ms ? data.duration_ms / 1000 : null;
      if (trackDurationSec){
        el.totalTime.textContent = formatTime(trackDurationSec);
      }

      if (isNewTrack){
        el.lyrics.classList.add('empty');
        el.lyrics.innerHTML = '';
        syncedLines = null;
        activeLine = -1;

        fetchLyricsData(artistName, trackTitle).then(({ synced, plain }) => {
          if (trackKey !== lastTrackKey) return; // track moved on before this resolved

          if (synced && synced.length){
            syncedLines = synced;
            el.lyrics.innerHTML = synced.map((l, i) =>
              `<div class="lyric-line" data-i="${i}">${l.text}</div>`
            ).join('');
            el.lyrics.classList.remove('empty');
          } else if (plain){
            el.lyrics.textContent = plain;
            el.lyrics.classList.remove('empty');
          } else {
            el.lyrics.textContent = 'no lyrics found for this track';
            el.lyrics.classList.remove('empty');
          }
        });
      }

      if (isNow){
        el.status.textContent = 'now playing';
        el.dot.className = 'dot live';
        startEqualizer();
      } else {
        el.status.textContent = 'paused';
        el.dot.className = 'dot';
        stopEqualizer();
      }
      isCurrentlyPlaying = isNow;
      el.progressWrap.style.display = trackDurationSec ? 'block' : 'none';

      el.updated.textContent = isNow ? 'live' : 'paused';

    } catch(err){
      el.status.textContent = 'connection error';
      el.dot.className = 'dot';
      el.updated.textContent = 'retrying…';
    }
  }

  function currentElapsedSec(){
    return accumulatedElapsedSec + (playStartMs ? (Date.now() - playStartMs) / 1000 : 0);
  }

  function tickLyrics(){
    if (!isCurrentlyPlaying){
      return; // don't advance progress/lyrics for a track that isn't actually live
    }

    const elapsed = currentElapsedSec();

    if (trackDurationSec){
      const pct = Math.min(100, (elapsed / trackDurationSec) * 100);
      el.progressFill.style.width = pct + '%';
      el.elapsedTime.textContent = formatTime(Math.min(elapsed, trackDurationSec));
    }

    if (!syncedLines) return;
    let idx = -1;
    for (let i = 0; i < syncedLines.length; i++){
      if (syncedLines[i].time <= elapsed) idx = i; else break;
    }
    if (idx !== activeLine){
      const prev = el.lyrics.querySelector('.lyric-line.active');
      if (prev) prev.classList.remove('active');
      if (idx >= 0){
        const cur = el.lyrics.querySelector(`.lyric-line[data-i="${idx}"]`);
        if (cur){
          cur.classList.add('active');
          cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      }
      activeLine = idx;
    }
  }

  // --- realistic-feeling equalizer ---
  const barEls = Array.from(el.bars.querySelectorAll('span'));
  let eqInterval = null;
  let eqTarget = barEls.map(() => 6);
  let eqMode = 'idle';

  function runEqualizer(min, max, speed){
    clearInterval(eqInterval);
    eqInterval = setInterval(() => {
      barEls.forEach((bar, i) => {
        const drift = (Math.random() - 0.5) * (max * 0.6);
        let next = eqTarget[i] + drift;
        next = Math.max(min, Math.min(max, next));
        eqTarget[i] = next;
        bar.style.height = next + 'px';
      });
    }, speed);
  }

  function startEqualizer(){
    if (eqMode === 'active') return;
    eqMode = 'active';
    runEqualizer(6, 38, 120);
  }

  function stopEqualizer(){
    if (eqMode === 'idle') return;
    eqMode = 'idle';
    runEqualizer(4, 10, 400);
  }

  runEqualizer(4, 10, 400); // start in idle mode immediately, before we even know play state

  // --- tilt / parallax on album art ---
  let tiltEnabled = true;
  function applyTilt(x, y){
    if (!tiltEnabled) return;
    const rotY = x * 10;
    const rotX = -y * 10;
    el.art.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg) translateZ(6px)`;
  }

  window.addEventListener('deviceorientation', (e) => {
    if (e.gamma === null) return;
    const x = Math.max(-1, Math.min(1, (e.gamma || 0) / 30));
    const y = Math.max(-1, Math.min(1, ((e.beta || 45) - 45) / 30));
    applyTilt(x, y);
  });

  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2;
    const y = (e.clientY / window.innerHeight - 0.5) * 2;
    applyTilt(x * 0.6, y * 0.6);
  });

  function requestMotionPermission(){
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().catch(() => {});
    }
  }
  document.addEventListener('click', requestMotionPermission, { once: true });
  document.addEventListener('touchstart', requestMotionPermission, { once: true });

  // --- ambient particles ---
  (function spawnParticles(){
    const container = document.getElementById('particles');
    const count = 22;
    for (let i = 0; i < count; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 2 + Math.random() * 2.5;
      const left = Math.random() * 100;
      const duration = 14 + Math.random() * 16;
      const delay = -Math.random() * duration;
      const drift = (Math.random() - 0.5) * 60;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = left + '%';
      p.style.animationDuration = duration + 's';
      p.style.animationDelay = delay + 's';
      p.style.setProperty('--drift', drift + 'px');
      container.appendChild(p);
    }
  })();

  fetchNowPlaying();
  setInterval(fetchNowPlaying, POLL_MS);
  setInterval(tickLyrics, 400);

  // --- song request queue ---
  const qEl = {
    form: document.getElementById('requestForm'),
    song: document.getElementById('reqSong'),
    artist: document.getElementById('reqArtist'),
    name: document.getElementById('reqName'),
    submit: document.getElementById('reqSubmit'),
    status: document.getElementById('reqStatus'),
    list: document.getElementById('queueList'),
    suggestions: document.getElementById('songSuggestions'),
  };

  let searchDebounce = null;
  let suggestionResults = [];

  async function searchSongs(query){
    try{
      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=6`);
      const data = await res.json();
      return data?.results || [];
    } catch(e){
      return [];
    }
  }

  function renderSuggestions(results){
    suggestionResults = results;
    if (!results.length){
      qEl.suggestions.classList.remove('show');
      qEl.suggestions.innerHTML = '';
      return;
    }
    qEl.suggestions.innerHTML = results.map((r, i) => `
      <div class="song-suggestion" data-i="${i}">
        <div class="ss-title">${escapeHtml(r.trackName || '')}</div>
        <div class="ss-artist">${escapeHtml(r.artistName || '')}</div>
      </div>
    `).join('');
    qEl.suggestions.classList.add('show');
  }

  qEl.song.addEventListener('input', () => {
    const q = qEl.song.value.trim();
    clearTimeout(searchDebounce);
    if (q.length < 2){
      renderSuggestions([]);
      return;
    }
    searchDebounce = setTimeout(async () => {
      const results = await searchSongs(q);
      renderSuggestions(results);
    }, 300);
  });

  qEl.suggestions.addEventListener('click', (e) => {
    const item = e.target.closest('.song-suggestion');
    if (!item) return;
    const pick = suggestionResults[parseInt(item.dataset.i, 10)];
    if (!pick) return;
    qEl.song.value = pick.trackName || '';
    qEl.artist.value = pick.artistName || '';
    renderSuggestions([]);
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.song-input-wrap')) renderSuggestions([]);
  });

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  async function loadQueue(){
    try{
      const { data, error } = await sb
        .from('queue')
        .select('song, artist, requester, created_at')
        .order('created_at', { ascending: false })
        .limit(8);

      if (error || !data || data.length === 0){
        qEl.list.innerHTML = '<div class="queue-empty">nothing queued yet — be the first</div>';
        return;
      }

      qEl.list.innerHTML = data.map(row => `
        <div class="queue-item">
          <span>
            <span class="qi-song">${escapeHtml(row.song)}</span>
            ${row.artist ? `<span class="qi-artist"> — ${escapeHtml(row.artist)}</span>` : ''}
          </span>
          <span class="qi-by">${row.requester ? escapeHtml(row.requester) : 'anon'}</span>
        </div>
      `).join('');
    } catch(e){
      // leave last known list showing rather than clearing on a transient error
    }
  }

  qEl.form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const song = qEl.song.value.trim();
    const artist = qEl.artist.value.trim();
    if (!song) return;

    qEl.submit.disabled = true;
    qEl.status.textContent = 'adding…';

    let displayOk = false;
    try{
      const { error } = await sb.from('queue').insert({
        song: song,
        artist: artist || null,
        requester: qEl.name.value.trim() || null,
      });
      displayOk = !error;
    } catch(e){
      displayOk = false;
    }

    let spotifyStatus = null;
    try{
      const q = new URLSearchParams({ action: 'queue', song, artist });
      const res = await fetch(`${WORKER_URL}?${q.toString()}`);
      const data = await res.json();
      if (data.success){
        spotifyStatus = 'queued';
      } else if (data.error === 'no_active_device'){
        spotifyStatus = 'no_device';
      } else if (data.error === 'track_not_found'){
        spotifyStatus = 'not_found';
      } else {
        spotifyStatus = 'failed';
      }
    } catch(e){
      spotifyStatus = 'failed';
    }

    if (spotifyStatus === 'queued'){
      qEl.status.textContent = 'added to Spotify queue!';
    } else if (spotifyStatus === 'no_device'){
      qEl.status.textContent = displayOk ? 'added to list (Spotify not active right now)' : 'could not add — try again';
    } else if (spotifyStatus === 'not_found'){
      qEl.status.textContent = displayOk ? 'added to list (couldn\'t find exact song on Spotify)' : 'could not add — try again';
    } else if (displayOk){
      qEl.status.textContent = 'added to the queue';
    } else {
      qEl.status.textContent = 'could not add — try again';
    }

    if (displayOk){
      qEl.form.reset();
      loadQueue();
    }

    qEl.submit.disabled = false;
    setTimeout(() => { qEl.status.textContent = ''; }, 4000);
  });

  loadQueue();
  setInterval(loadQueue, 1000);

  // --- skip button ---
  const skipBtn = document.getElementById('skipBtn');
  skipBtn.addEventListener('click', async () => {
    skipBtn.disabled = true;
    const original = skipBtn.textContent;
    skipBtn.textContent = '…';
    try{
      const res = await fetch(`${WORKER_URL}?action=skip`);
      const data = await res.json();
      skipBtn.textContent = data.success ? '✓' : '✕';
    } catch(e){
      skipBtn.textContent = '✕';
    }
    setTimeout(() => {
      skipBtn.textContent = original;
      skipBtn.disabled = false;
    }, 1500);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') fetchNowPlaying();
  });
</script>

</body>
</html>
